# =============================================================================
# GitHub Actions workflow TEMPLATE - for the odoo.sh addon repo
# (syncoria/syncoria-Demo-Master), NOT this toolkit repo.
#
# Place this at .github/workflows/deploy.yml in that repo. Triggers a
# non-destructive code deploy (pull latest addons + Python deps + schema
# reconcile, no DB drop/recreate) on every push to main (production) or
# Staging (staging), via the restricted CI deploy key set up by
# ./setup-ci-deploy.sh in the odoo-aws-migration-scripts toolkit.
#
# One-time setup before this workflow can run:
#   1. In odoo-aws-migration-scripts: ./setup-ci-deploy.sh
#      (installs the forced-command SSH restriction on both boxes)
#   2. In odoo-aws-migration-scripts: ./setup-ci-aws-access.sh
#      (creates a GitHub OIDC identity provider + IAM role in AWS, scoped to
#      ONLY authorize/revoke SSH ingress on the one project security group -
#      needed because the SG intentionally only allows SSH from the
#      operator's own IP, and GitHub-hosted runners come from Azure's IP
#      space and can never match it. No static AWS access key is ever
#      stored - the workflow exchanges a short-lived OIDC token for
#      temporary credentials on every run.)
#   3. In THIS repo (syncoria/syncoria-Demo-Master), set:
#      - Secret   CI_DEPLOY_SSH_KEY  = contents of secrets/ci-deploy-key
#      - Variable PRODUCTION_HOST    = current production Elastic IP
#      - Variable STAGING_HOST       = current staging Elastic IP
#      - Variable AWS_ROLE_ARN       = printed by setup-ci-aws-access.sh
#      - Variable SECURITY_GROUP_ID  = printed by setup-ci-aws-access.sh
#      - Variable AWS_REGION         = printed by setup-ci-aws-access.sh
#      Example (run from the toolkit repo, never prints the key):
#        gh secret set CI_DEPLOY_SSH_KEY --repo syncoria/syncoria-Demo-Master < secrets/ci-deploy-key
#        gh variable set PRODUCTION_HOST --repo syncoria/syncoria-Demo-Master --body "<production EIP>"
#        gh variable set STAGING_HOST    --repo syncoria/syncoria-Demo-Master --body "<staging EIP>"
#        (AWS_ROLE_ARN / SECURITY_GROUP_ID / AWS_REGION: use the gh variable set
#         commands setup-ci-aws-access.sh prints for you)
#
# IMPORTANT: Elastic IPs change if the environment is ever torn down and
# re-provisioned (./99-teardown.sh + ./01-provision-aws.sh). Update the
# PRODUCTION_HOST / STAGING_HOST repo variables after any re-provision, or
# this workflow will fail to connect. Also re-run ./setup-ci-deploy.sh on the
# new boxes - the keypair itself doesn't change, but its server-side
# installation does (a fresh instance has an empty authorized_keys). If the
# security group itself is ever recreated, re-run ./setup-ci-aws-access.sh
# too and update SECURITY_GROUP_ID.
#
# IMPORTANT: GitHub only fires a push-triggered workflow if the workflow file
# already exists on the branch being pushed to. Adding this to `main` does NOT
# cover `Staging` (or vice versa) - commit it to both branches separately if
# you want both to auto-deploy (that's why this toolkit's setup opened two
# companion PRs, one per branch, rather than one PR touching both).
#
# The SSH command below sends a literal "deploy" string, but the actual
# command that runs is entirely determined server-side by the forced
# `command=` restriction on the CI key (see setup-ci-deploy.sh) - whatever
# is sent here is ignored. That's the point: even if this workflow file or
# the secret were compromised, the attacker still can't run arbitrary
# commands on the box, only this one non-destructive deploy script.
# =============================================================================
name: Deploy to AWS (Odoo)

on:
  push:
    branches:
      - main
      - Staging

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write   # required for AWS OIDC token exchange
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target host for this branch
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "host=${{ vars.PRODUCTION_HOST }}" >> "$GITHUB_OUTPUT"
            echo "env_name=production" >> "$GITHUB_OUTPUT"
          else
            echo "host=${{ vars.STAGING_HOST }}" >> "$GITHUB_OUTPUT"
            echo "env_name=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Assume scoped AWS role (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Open a temporary SSH rule for this runner's IP
        id: runner_ip
        run: |
          MY_IP="$(curl -fsS https://checkip.amazonaws.com)"
          echo "ip=${MY_IP}" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ vars.SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 --cidr "${MY_IP}/32" \
            || echo "Rule may already exist - continuing"

      - name: Configure CI deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CI_DEPLOY_SSH_KEY }}" > ~/.ssh/ci_deploy_key
          chmod 600 ~/.ssh/ci_deploy_key
          ssh-keyscan -H "${{ steps.target.outputs.host }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Trigger deploy on ${{ steps.target.outputs.env_name }}
        timeout-minutes: 20
        run: |
          # ServerAliveInterval/CountMax: the remote deploy redirects its own
          # output to a log file, so this SSH session sees nothing for
          # minutes at a stretch during the schema reconcile - long enough
          # for an idle NAT/firewall between the runner and AWS to drop the
          # connection. Periodic keepalive probes keep packets flowing so
          # that doesn't happen.
          ssh -i ~/.ssh/ci_deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "ubuntu@${{ steps.target.outputs.host }}" "deploy"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/ci_deploy_key

      - name: Revoke the temporary SSH rule
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ vars.SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 --cidr "${{ steps.runner_ip.outputs.ip }}/32" \
            || echo "Rule may already be gone - continuing"
